plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fastingservice'
version = '0.1.0'

android {
  namespace "expo.modules.fastingservice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ServiceCompat / NotificationCompat / ContextCompat. Gradle resolves to the
  // app's (higher) androidx.core version if it pins a newer one.
  implementation "androidx.core:core-ktx:1.13.1"
}
